<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vendor Part Search</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", -apple-system, Roboto, sans-serif;
            background: #2b2b2b; color: #d9d9d9; font-size: 13px;
        }

        #status {
            position: sticky; top: 0; z-index: 10;
            padding: 9px 14px;
            background: #3d3d3d; color: #fff; font-size: 13px;
            border-bottom: 1px solid #565656;
        }

        #results { padding: 10px; }
        .card {
            display: flex; gap: 10px;
            border: 1px solid #4a4a4a; border-radius: 4px;
            padding: 10px; margin-bottom: 8px;
            background: #3a3a3a;
        }
        .card .imgbox {
            width: 90px; height: 90px; flex-shrink: 0;
            background: #2f2f2f; border-radius: 3px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #4a4a4a;
        }
        .card .imgbox .noimg {
            width: 30px; height: 30px; opacity: 0.35;
        }
        .card .imgbox img {
            max-width: 100%; max-height: 100%; object-fit: cover; display: block;
        }
        .card .info { flex: 1; min-width: 0; }
        .card .info .name { font-weight: 600; font-size: 14px; margin-bottom: 2px; color: #fff; }
        .card .info .author { color: #9a9a9a; font-size: 12px; margin-bottom: 6px; }
        .files { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
        .files .lbl { font-size: 12px; margin-right: 4px; color: #9a9a9a; }
        .dl {
            font-size: 12px; padding: 4px 9px;
            background: #3f8Cff; color: #fff;
            border: none; border-radius: 3px; cursor: pointer;
        }
        .dl:hover { background: #5a9bff; }
        .dl:disabled { background: #555; color: #999; cursor: default; }

        .pager {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px; position: sticky; bottom: 0;
            background: #2b2b2b; border-top: 1px solid #4a4a4a;
        }
        .pager .pg {
            font-size: 12px; padding: 4px 10px;
            background: #3f8Cff; color: #fff; border: none; border-radius: 3px; cursor: pointer;
        }
        .pager .pg:hover { background: #5a9bff; }
        .pager .pg:disabled { background: #444; color: #999; cursor: default; }
        .pager .pglabel { color: #cfcfcf; font-size: 12px; margin: 0 4px; }
        .empty { text-align: center; color: #9a9a9a; padding: 30px 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div id="status">Search results will appear here.</div>
    <div id="results"></div>
    <script src="static/palette.js"></script>
</body>
</html>
